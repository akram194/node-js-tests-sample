name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3

        with:
          node-version: 16

      - name: Install dependencies
        run: |
          npm install
          npm install mocha chai@4.3.4 sinon --save-dev

      - name: Run tests
        run: npx mocha

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          npm install
          npm install mocha chai@4.3.4 sinon --save-dev

      - name: Deploy to production
        run: npm run deploy
